<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Schulplaner: Hausaufgaben, Kalender, Stundenplan, Karteikarten, Noten und Zielnoten.">
<meta name="theme-color" content="#1F3BA8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schulplaner">
<meta name="referrer" content="same-origin">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-512.png" type="image/png">
<style>
  :root{color-scheme:light dark}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none !important}
</style>
<title>Schulplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#EDEFF4; --karo:#E1E5EE; --surface:#FFFFFF; --surface-2:#F4F6FB;
  --ink:#141821; --ink-2:#4E5566; --ink-3:#838CA1;
  --line:#DCE1EC; --line-2:#C4CBDB;
  --tinte:#1F3BA8; --tinte-soft:#E4E9FA; --tinte-ink:#1F3BA8; --on-tinte:#FFFFFF;
  --rot:#B93A2E; --rot-soft:#FAE5E2; --on-rot:#FFFFFF;
  --gruen:#226A48; --gruen-soft:#DEF0E6;
  --ocker:#9E640D; --ocker-soft:#F9EED8;
  --chip-s:55%; --chip-bg-l:92%; --chip-fg-s:52%; --chip-fg-l:29%; --dot-l:45%;
  --shadow:0 1px 2px rgba(20,24,33,.05), 0 10px 26px -16px rgba(20,24,33,.35);
  --shadow-lift:0 2px 4px rgba(20,24,33,.06), 0 20px 44px -20px rgba(20,24,33,.42);
  --r:14px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --disp:"Archivo", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1218; --karo:#181C25; --surface:#181C25; --surface-2:#1F242F;
    --ink:#E8EBF3; --ink-2:#A6AFC2; --ink-3:#7A8399;
    --line:#282E3A; --line-2:#3A4252;
    --tinte:#8BA1FF; --tinte-soft:#1C2340; --tinte-ink:#A9B9FF; --on-tinte:#0F1218;
    --rot:#FF8B7E; --rot-soft:#341F1C; --on-rot:#241110;
    --gruen:#69D09A; --gruen-soft:#12301F;
    --ocker:#E3B15C; --ocker-soft:#2E2413;
    --chip-s:38%; --chip-bg-l:20%; --chip-fg-s:68%; --chip-fg-l:74%; --dot-l:62%;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 20px 44px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1218; --karo:#181C25; --surface:#181C25; --surface-2:#1F242F;
  --ink:#E8EBF3; --ink-2:#A6AFC2; --ink-3:#7A8399;
  --line:#282E3A; --line-2:#3A4252;
  --tinte:#8BA1FF; --tinte-soft:#1C2340; --tinte-ink:#A9B9FF; --on-tinte:#0F1218;
  --rot:#FF8B7E; --rot-soft:#341F1C; --on-rot:#241110;
  --gruen:#69D09A; --gruen-soft:#12301F;
  --ocker:#E3B15C; --ocker-soft:#2E2413;
  --chip-s:38%; --chip-bg-l:20%; --chip-fg-s:68%; --chip-fg-l:74%; --dot-l:62%;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 20px 44px -20px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--karo) 1px, transparent 1px), linear-gradient(90deg, var(--karo) 1px, transparent 1px);
  background-size:26px 26px; background-position:-1px -1px;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0; text-align:left}
:focus-visible{outline:2.5px solid var(--tinte); outline-offset:2px; border-radius:6px}
h1,h2,h3{margin:0; font-family:var(--disp); font-weight:700; letter-spacing:-.015em; text-wrap:balance}
p{margin:0}
ul,ol{margin:0; padding:0; list-style:none}

.shell{display:flex; flex-direction:column-reverse; justify-content:flex-end; min-height:100dvh}
.main{flex:1; display:flex; flex-direction:column; min-width:0}
.top{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:10px 16px; padding-top:max(10px, env(safe-area-inset-top));
  background:color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.wordmark{display:flex; align-items:baseline; gap:9px; min-width:0}
.wordmark b{font-family:var(--disp); font-size:1.06rem; font-weight:700; letter-spacing:-.025em}
.wordmark span{font-family:var(--mono); font-size:.71rem; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sp{flex:1}
.iconbtn{
  width:40px; height:40px; display:grid; place-items:center; border-radius:11px; flex:0 0 auto;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2); position:relative;
}
.iconbtn:active{transform:scale(.95)}
.iconbtn svg{width:20px; height:20px; stroke-width:1.8}
.badge{
  position:absolute; top:-6px; right:-6px; min-width:19px; height:19px; padding:0 5px; border-radius:10px;
  background:var(--rot); color:var(--on-rot); font-size:.67rem; font-weight:600; display:grid; place-items:center;
  font-family:var(--mono); border:2px solid var(--paper);
}
#view{padding:18px 16px 104px; max-width:880px; width:100%; margin:0 auto; flex:1}

.tabs{
  position:sticky; bottom:0; z-index:30; display:flex; gap:2px; justify-content:space-around;
  background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding:6px 6px max(6px, env(safe-area-inset-bottom));
}
.tab{
  flex:1; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border-radius:12px; color:var(--ink-3); font-size:.68rem; font-weight:500; position:relative; text-align:center;
}
.tab svg{width:23px; height:23px; stroke-width:1.7}
.tab[aria-current="page"]{color:var(--tinte-ink); background:var(--tinte-soft)}
.tab .cnt{
  position:absolute; top:3px; right:calc(50% - 24px); min-width:17px; height:17px; padding:0 4px;
  background:var(--rot); color:var(--on-rot); border-radius:9px; font-family:var(--mono);
  font-size:.62rem; font-weight:600; display:grid; place-items:center;
}
@media (min-width:900px){
  .shell{flex-direction:row}
  .tabs{
    flex-direction:column; justify-content:flex-start; gap:4px; width:230px; flex:0 0 230px;
    height:100dvh; position:sticky; top:0; bottom:auto; border-top:0; border-right:1px solid var(--line);
    padding:20px 12px; background:color-mix(in srgb, var(--surface) 78%, transparent);
  }
  .tabs::before{
    content:"Schulplaner"; font-family:var(--disp); font-weight:700; font-size:1.15rem; letter-spacing:-.02em;
    padding:0 14px 16px; color:var(--ink);
  }
  .tab{flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:12px; padding:0 14px; min-height:46px; font-size:.95rem}
  .tab .cnt{position:static; margin-left:auto}
  .wordmark{display:none}
  #view{padding:26px 34px 110px}
  .top{padding-left:34px; padding-right:34px}
}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.flat{box-shadow:none}
.stack{display:flex; flex-direction:column; gap:14px}
.stack-s{display:flex; flex-direction:column; gap:8px}
.sec{display:flex; flex-direction:column; gap:10px; margin-top:26px}
.sec:first-child{margin-top:0}
.sec > header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.sec > header h2{font-size:1.02rem}
.lbl{font-size:.69rem; text-transform:uppercase; letter-spacing:.09em; font-weight:600; color:var(--ink-3)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.sm{font-size:.86rem}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.empty{padding:24px 20px; text-align:center; color:var(--ink-3); font-size:.92rem; border:1px dashed var(--line-2); border-radius:var(--r)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 18px;
  border-radius:12px; background:var(--tinte); color:var(--on-tinte); font-weight:600; font-size:.94rem;
  border:1px solid transparent; text-align:center;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.42; pointer-events:none}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line-2)}
.btn.soft{background:var(--tinte-soft); color:var(--tinte-ink)}
.btn.danger{background:var(--rot-soft); color:var(--rot)}
.btn.small{min-height:38px; padding:0 13px; font-size:.85rem; border-radius:10px}
.btn.wide{width:100%}
.btn svg{width:19px; height:19px; stroke-width:1.9; flex:0 0 auto}
.btnrow{display:flex; flex-wrap:wrap; gap:9px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
  width:100%; min-height:46px; padding:10px 13px; border-radius:11px; border:1px solid var(--line-2);
  background:var(--surface); font-size:16px; font-family:inherit;
}
textarea{min-height:96px; resize:vertical; line-height:1.5}
label.f{display:flex; flex-direction:column; gap:6px}
label.f > span{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; font-weight:600; color:var(--ink-3)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:7px; font-size:.76rem;
  font-weight:600; white-space:nowrap;
  background:hsl(var(--h,214) var(--chip-s) var(--chip-bg-l)); color:hsl(var(--h,214) var(--chip-fg-s) var(--chip-fg-l));
}
.dot{width:7px; height:7px; border-radius:50%; background:hsl(var(--h,214) 62% var(--dot-l)); flex:0 0 auto}
.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:.74rem; font-weight:600; white-space:nowrap}
.pill.rot{background:var(--rot-soft); color:var(--rot)}
.pill.gruen{background:var(--gruen-soft); color:var(--gruen)}
.pill.ocker{background:var(--ocker-soft); color:var(--ocker)}
.pill.tinte{background:var(--tinte-soft); color:var(--tinte-ink)}
.pill.grau{background:var(--surface-2); color:var(--ink-3)}

.hero{padding:20px 18px; display:flex; flex-direction:column; gap:4px}
.hero .tag{font-family:var(--mono); font-size:.75rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.08em}
.hero h1{font-size:clamp(1.5rem,4.6vw,2rem); line-height:1.12}
.hero .sub{color:var(--ink-2); font-size:.94rem; margin-top:4px}
.nudge{
  display:flex; gap:13px; align-items:flex-start; padding:15px 16px; border-radius:var(--r); width:100%;
  background:var(--tinte-soft); border:1px solid color-mix(in srgb, var(--tinte) 22%, transparent); text-align:left;
}
.nudge.warn{background:var(--ocker-soft); border-color:color-mix(in srgb, var(--ocker) 30%, transparent)}
.nudge.alarm{background:var(--rot-soft); border-color:color-mix(in srgb, var(--rot) 30%, transparent)}
.nudge.still{background:var(--surface); border-color:var(--line)}
.nudge > svg{width:22px; height:22px; flex:0 0 auto; margin-top:1px; stroke-width:1.8}
.nudge .tx{min-width:0; flex:1}
.nudge b{display:block; font-family:var(--disp); font-size:.97rem}
.nudge .p{font-size:.87rem; color:var(--ink-2); margin-top:2px; overflow-wrap:anywhere}

.item{display:flex; align-items:flex-start; gap:12px; padding:13px 14px; width:100%; background:none}
.list{display:flex; flex-direction:column; overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.check{
  width:27px; height:27px; border-radius:9px; border:2px solid var(--line-2); flex:0 0 auto; margin-top:1px;
  display:grid; place-items:center; color:transparent; background:var(--surface);
}
.check svg{width:16px; height:16px; stroke-width:3}
.item.done .check{background:var(--gruen); border-color:var(--gruen); color:var(--surface)}
.item.done .t{text-decoration:line-through; color:var(--ink-3)}
.item .body{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; text-align:left}
.item .t{font-weight:500; line-height:1.35; overflow-wrap:anywhere}
.item .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.item .note{font-size:.85rem; color:var(--ink-2); overflow-wrap:anywhere}
.daygroup{display:flex; flex-direction:column; gap:8px}
.daygroup > .head{display:flex; align-items:baseline; gap:9px; padding:0 3px}
.daygroup > .head .d{font-family:var(--disp); font-weight:600; font-size:.92rem}
.daygroup > .head .n{font-family:var(--mono); font-size:.76rem; color:var(--ink-3)}
.filters{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{
  padding:7px 13px; border-radius:999px; border:1px solid var(--line-2); background:var(--surface);
  font-size:.85rem; font-weight:500; color:var(--ink-2); white-space:nowrap; min-height:38px;
}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.quick{display:flex; gap:8px; align-items:stretch}
.quick input{flex:1}
.quick .btn{padding:0 14px}

.calhead{display:flex; align-items:center; gap:8px}
.calhead h2{flex:1; font-size:1.1rem}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; padding:10px}
.cal .wd{text-align:center; font-size:.68rem; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; padding-bottom:4px}
.cal .day{
  aspect-ratio:1/1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; font-family:var(--mono); font-size:.88rem; color:var(--ink); border:1px solid transparent; min-height:40px;
}
.cal .day.out{color:var(--ink-3); opacity:.5}
.cal .day.today{border-color:var(--tinte); color:var(--tinte-ink); font-weight:600}
.cal .day[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.cal .day .dots{display:flex; gap:2.5px; height:7px; align-items:center}
.cal .day .dots .dot{width:5.5px; height:5.5px}
.cal .day .ex{width:5.5px; height:5.5px; border-radius:50%; background:var(--rot)}
.wcol{display:flex; flex-direction:column; gap:6px}
.wcol > .hd{display:flex; align-items:baseline; gap:8px; padding:0 2px}
.wcol > .hd b{font-family:var(--disp); font-size:.95rem}
.wcol > .hd.jetzt b{color:var(--tinte-ink)}

.testcard{padding:16px; display:flex; flex-direction:column; gap:12px; width:100%; background:var(--surface); text-align:left}
.testcard .l1{display:flex; align-items:flex-start; gap:10px}
.testcard .l1 .body{flex:1; min-width:0}
.testcard h3{font-size:1.06rem; line-height:1.25}
.testcard .when{text-align:right; flex:0 0 auto}
.testcard .when .num{font-family:var(--disp); font-size:1.5rem; font-weight:700; line-height:1; letter-spacing:-.03em; display:block}
.testcard .when .unit{font-family:var(--mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3)}
.testcard.soon .when .num{color:var(--rot)}
.bar{height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line)}
.bar i{display:block; height:100%; background:var(--tinte); border-radius:4px}
.bar.gruen i{background:var(--gruen)}
.bar.ocker i{background:var(--ocker)}
.bar.rot i{background:var(--rot)}
.barrow{display:flex; align-items:center; gap:10px}
.barrow .bar{flex:1}
.barrow .pct{font-family:var(--mono); font-size:.76rem; color:var(--ink-3); min-width:38px; text-align:right}

.sheet{position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; background:rgba(10,13,20,.42); backdrop-filter:blur(3px)}
.sheet[hidden]{display:none}
.sheet > .panel{
  background:var(--paper); width:100%; max-width:640px; max-height:92dvh; display:flex; flex-direction:column;
  border-radius:20px 20px 0 0; box-shadow:var(--shadow-lift); border:1px solid var(--line); border-bottom:0;
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(18px); opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet > .panel{animation:none}}
@media (min-width:700px){
  .sheet{align-items:center; padding:24px}
  .sheet > .panel{border-radius:18px; border-bottom:1px solid var(--line); max-height:86dvh}
}
.panel > header{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); border-radius:20px 20px 0 0; z-index:2}
.panel > header h2{flex:1; font-size:1.05rem; min-width:0}
.panel > .body{padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; -webkit-overflow-scrolling:touch}
.panel > footer{padding:12px 16px max(12px, env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; gap:9px}
.panel > footer .btn{flex:1}

.flash{min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:28px 22px; text-align:center; background:var(--surface); border-radius:var(--r); border:1px solid var(--line); box-shadow:var(--shadow); width:100%}
.flash .q{font-family:var(--disp); font-size:1.25rem; line-height:1.3; font-weight:600}
.flash .a{font-size:1rem; color:var(--ink-2); line-height:1.55; border-top:1px dashed var(--line-2); padding-top:14px; width:100%}
.flash .hint{font-size:.8rem; color:var(--ink-3)}
.progressdots{display:flex; gap:4px; justify-content:center; flex-wrap:wrap}
.progressdots i{width:7px; height:7px; border-radius:50%; background:var(--line-2)}
.progressdots i.on{background:var(--tinte)}
.progressdots i.now{background:var(--ink); transform:scale(1.35)}

.qopt{display:flex; gap:11px; align-items:flex-start; padding:13px 14px; border-radius:12px; width:100%; border:1px solid var(--line-2); background:var(--surface); font-size:.95rem; line-height:1.4; text-align:left}
.qopt .k{width:25px; height:25px; border-radius:7px; background:var(--surface-2); color:var(--ink-2); flex:0 0 auto; display:grid; place-items:center; font-family:var(--mono); font-size:.8rem; font-weight:600}
.qopt.right{border-color:var(--gruen); background:var(--gruen-soft)}
.qopt.right .k{background:var(--gruen); color:var(--surface)}
.qopt.wrong{border-color:var(--rot); background:var(--rot-soft)}
.qopt.wrong .k{background:var(--rot); color:var(--on-rot)}
.qopt[disabled]{pointer-events:none; opacity:1}
.score{font-family:var(--disp); font-size:3rem; font-weight:700; line-height:1; letter-spacing:-.04em}

.dropzone{border:1.5px dashed var(--line-2); border-radius:var(--r); padding:26px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px}
.dropzone > svg{width:34px; height:34px; stroke-width:1.4; color:var(--ink-3)}
.thumbs{display:flex; gap:8px; flex-wrap:wrap}
.thumbs figure{margin:0; position:relative; width:78px; height:78px; border-radius:10px; overflow:hidden; border:1px solid var(--line-2)}
.thumbs img{width:100%; height:100%; object-fit:cover; display:block}
.thumbs button{position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; background:rgba(10,13,20,.72); color:#fff; display:grid; place-items:center; font-size:.8rem; line-height:1; text-align:center}
.steps{display:flex; flex-direction:column; gap:9px}
.step{display:flex; gap:11px; align-items:flex-start}
.step .n{width:23px; height:23px; border-radius:50%; background:var(--tinte-soft); color:var(--tinte-ink); flex:0 0 auto; display:grid; place-items:center; font-family:var(--mono); font-size:.75rem; font-weight:600}
.step .p{font-size:.9rem; color:var(--ink-2)}
.spin{width:17px; height:17px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.aitext{font-size:.97rem; line-height:1.62; white-space:pre-wrap; overflow-wrap:anywhere}

.slot{display:flex; align-items:center; gap:11px; padding:11px 14px}
.slot .time{font-family:var(--mono); font-size:.83rem; color:var(--ink-3); min-width:42px; font-variant-numeric:tabular-nums}
.slot .rule{width:3px; align-self:stretch; border-radius:2px; background:hsl(var(--h,214) 60% var(--dot-l))}

#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:90vw}
#toast div{background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:11px; font-size:.88rem; box-shadow:var(--shadow-lift); animation:up .2s ease}
@media (min-width:900px){#toast{bottom:24px}}
.kbdhint{font-size:.78rem; color:var(--ink-3); text-align:center}
.split{display:flex; gap:10px; align-items:center}
.split > *{flex:1}
.tick{display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%; text-align:left}
.tick .sw{width:44px; height:26px; border-radius:999px; background:var(--line-2); position:relative; flex:0 0 auto; transition:background .15s}
.tick .sw::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--surface); transition:transform .15s}
.tick[aria-pressed="true"] .sw{background:var(--tinte)}
.tick[aria-pressed="true"] .sw::after{transform:translateX(18px)}

/* Anmeldung, Profil, Niveau */
.gate{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.gate > .box{width:100%; max-width:470px; display:flex; flex-direction:column; gap:18px}
.gate .mark{font-family:var(--disp); font-weight:700; font-size:2.1rem; letter-spacing:-.035em; line-height:1}
.gate .claim{color:var(--ink-2); font-size:.95rem; margin-top:5px}
.avatar{
  width:46px; height:46px; border-radius:14px; display:grid; place-items:center; flex:0 0 auto;
  font-family:var(--disp); font-weight:700; font-size:1.1rem; letter-spacing:-.02em;
  background:hsl(var(--h,214) var(--chip-s) var(--chip-bg-l)); color:hsl(var(--h,214) var(--chip-fg-s) var(--chip-fg-l));
}
.avatar.big{width:66px; height:66px; border-radius:20px; font-size:1.6rem}
.avatar.mini{width:30px; height:30px; border-radius:9px; font-size:.8rem}
.who{display:flex; align-items:center; gap:13px; padding:13px 14px; width:100%; text-align:left}
.who .n{font-family:var(--disp); font-weight:600; font-size:1.02rem}
.who .k{font-size:.83rem; color:var(--ink-3)}
.optgrid{display:flex; flex-wrap:wrap; gap:7px}
.optgrid button{
  min-height:44px; min-width:46px; padding:0 14px; border-radius:11px; border:1px solid var(--line-2);
  background:var(--surface); font-size:.92rem; font-weight:500; color:var(--ink-2); text-align:center;
  display:inline-flex; align-items:center; justify-content:center;
}
.optgrid button[aria-pressed="true"]{background:var(--tinte); border-color:var(--tinte); color:var(--on-tinte); font-weight:600}
.seg{display:flex; gap:3px; padding:3px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line)}
.seg button{flex:1; min-height:38px; border-radius:9px; text-align:center; font-size:.87rem; font-weight:500; color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--shadow)}
.dots4{display:flex; gap:11px; justify-content:center; margin:6px 0}
.dots4 i{width:14px; height:14px; border-radius:50%; border:2px solid var(--line-2)}
.dots4 i.on{background:var(--ink); border-color:var(--ink)}
.pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.pinpad button{min-height:58px; border-radius:13px; background:var(--surface); border:1px solid var(--line-2); font-family:var(--mono); font-size:1.25rem; font-weight:500; display:grid; place-items:center; text-align:center}
.pinpad button:active{background:var(--surface-2)}
.stufe{display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:600; color:var(--ink-3)}
.stufe .seg3{display:flex; gap:2px}
.stufe .seg3 i{width:13px; height:5px; border-radius:3px; background:var(--line-2)}
.stufe .seg3 i.on{background:var(--tinte)}
.stufe.gut .seg3 i.on{background:var(--gruen)}
.stufe.mittel .seg3 i.on{background:var(--ocker)}
.stufe.schwach .seg3 i.on{background:var(--rot)}
.themacard{padding:12px 13px; display:flex; flex-direction:column; gap:8px}
.themacard .top2{display:flex; align-items:flex-start; gap:10px}
.themacard .top2 b{flex:1; font-weight:600; font-size:.95rem; line-height:1.35}
.hilfe{background:var(--surface-2); border-radius:11px; padding:11px 13px; font-size:.87rem; color:var(--ink-2); border:1px solid var(--line)}

/* Knöpfe unten rechts */
.fab{position:fixed; right:16px; bottom:calc(74px + env(safe-area-inset-bottom)); z-index:40; display:flex; gap:10px; align-items:flex-end}
@media (min-width:900px){.fab{bottom:26px; right:28px}}
.fab .fb{display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:56px; padding:0 20px; border-radius:18px; font-weight:600; font-size:.97rem; box-shadow:var(--shadow-lift)}
.fab .fb.prim{background:var(--tinte); color:var(--on-tinte)}
.fab .fb.alt{background:var(--surface); color:var(--ink); border:1px solid var(--line-2)}
.fab .fb svg{width:22px; height:22px; stroke-width:1.9; flex:0 0 auto}
.fab .fb:active{transform:scale(.97)}
@media (max-width:560px){.fab .fb.alt span{display:none} .fab .fb.alt{padding:0 17px}}

/* Lernstreifen */
.streifen{display:flex; gap:3px; align-items:flex-end}
.streifen i{flex:1; height:26px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line)}
.streifen i.an{background:var(--tinte); border-color:var(--tinte)}
.streifen i.heute{outline:2px solid var(--ink); outline-offset:1px}
.fragebox{display:flex; gap:8px; align-items:stretch}
.fragebox input{flex:1}
.notegross{font-family:var(--disp); font-weight:700; font-size:1.45rem; letter-spacing:-.02em; line-height:1}
.zeile{display:flex; align-items:center; gap:11px; padding:12px 14px; width:100%; text-align:left}
.zeile .nm{flex:1; min-width:0; font-weight:500}
.aufwandbox{display:flex; flex-direction:column; gap:9px; padding:14px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface-2)}
.aufwandbox .kopf{display:flex; align-items:center; gap:9px}
.aufwandbox .min{font-family:var(--disp); font-weight:700; font-size:1.35rem; letter-spacing:-.02em}
.notengrid{display:flex; flex-wrap:wrap; gap:7px}
.notengrid button{min-height:48px; min-width:56px; padding:0 12px; border-radius:12px; border:1px solid var(--line-2); background:var(--surface); font-family:var(--mono); font-size:1rem; font-weight:500; display:inline-flex; align-items:center; justify-content:center}
.notengrid button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
</style>

<body>
<script>window.SCHULPLANER_WEB = true;</script>


<div id="gate" class="gate" hidden></div>
<div class="shell" id="shell" hidden>
  <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
  <div class="main">
    <header class="top">
      <div class="wordmark"><b>Schulplaner</b><span id="topdate"></span></div>
      <div class="sp"></div>
      <button class="iconbtn" data-act="nudges" aria-label="Erinnerungen" id="bellbtn"></button>
      <button class="iconbtn" data-act="settings" aria-label="Profil und Einstellungen" id="profbtn"></button>
    </header>
    <main id="view"></main>
  </div>
  <div class="fab" id="fab"></div>
</div>
<div class="sheet" id="sheet" hidden></div>
<div id="toast"></div>

<script>
"use strict";
/* ===================== Grundlagen ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const WDK = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const toISO = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromISO = s => { const p = String(s || "").split("-").map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); };
const heute = () => toISO(new Date());
const plusTage = (iso, n) => { const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const tageBis = iso => Math.round((fromISO(iso) - fromISO(heute())) / 86400000);
function relTag(iso) {
  const n = tageBis(iso);
  if (n === 0) return "heute";
  if (n === 1) return "morgen";
  if (n === 2) return "übermorgen";
  if (n === -1) return "gestern";
  if (n < 0) return "vor " + (-n) + " Tagen";
  if (n < 7) return WD[fromISO(iso).getDay()];
  return "in " + n + " Tagen";
}
const datumLang = iso => { const d = fromISO(iso); return WD[d.getDay()] + ", " + d.getDate() + ". " + MON[d.getMonth()]; };
const datumKurz = iso => { const d = fromISO(iso); return WDK[d.getDay()] + " " + d.getDate() + "." + (d.getMonth() + 1) + "."; };
const initialen = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const profZeichen = p => (p && (p.kontoName || p.name)) ? initialen(p.kontoName || p.name) : String((p && p.klasse) || "?");
const profName = p => (p && (p.kontoName || p.name)) ? (p.kontoName || p.name) : "Klasse " + ((p && p.klasse) || "?");
function toast(msg) {
  const t = document.createElement("div"); t.textContent = msg; $("#toast").append(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 320); }, 2600);
}
const ICON = {
  heute: '<path d="M3 12 12 3l9 9"/><path d="M5 10v10h14V10"/>',
  aufgaben: '<path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4"/>',
  kalender: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/>',
  lernen: '<path d="M12 7 3 4.6 3 18l9 2.4L21 18V4.6L12 7z"/><path d="M12 7v13.4"/>',
  scan: '<path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2"/><circle cx="12" cy="12" r="3.4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M4 12.5 9.5 18 20 6.5"/>',
  zurueck: '<path d="M15 5l-7 7 7 7"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>',
  glocke: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  funke: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
  kamera: '<path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="4"/>',
  karte: '<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h6M6 13h4"/>',
  quiz: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.5"/><path d="M12 17h.01"/>',
  uhr: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  muell: '<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>',
  stift: '<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/>',
  download: '<path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  person: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
  schloss: '<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  raus: '<path d="M14 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5M5 12h10"/>',
  sonne: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
  hoch: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  leicht: '<path d="M12 2.5 14.9 9l7 .6-5.3 4.6 1.6 6.9L12 17.4 5.8 21.1l1.6-6.9L2.1 9.6 9.1 9z"/>',
  buch: '<path d="M4 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H20z"/>'
};
const svg = (n, cls) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"' + (cls ? ' class="' + cls + '"' : "") + ">" + (ICON[n] || "") + "</svg>";

/* ===================== Stammdaten ===================== */
const FACH_HUE = {
  "Mathematik": 214, "Deutsch": 352, "Englisch": 26, "Französisch": 330, "Latein": 96, "Spanisch": 12,
  "Biologie": 146, "Physik": 264, "Chemie": 186, "Informatik": 200, "Naturwissenschaften": 170,
  "Geschichte": 40, "Erdkunde": 168, "Politik": 20, "Wirtschaft": 48, "Religion": 250, "Ethik": 250,
  "Sport": 6, "Kunst": 318, "Musik": 288, "Technik": 210, "Hauswirtschaft": 130
};
const SCHULFORMEN = ["Gymnasium", "Realschule", "Gesamtschule", "Hauptschule", "Sekundarschule", "Mittelschule", "Oberschule", "Berufskolleg", "Berufsschule", "Waldorfschule", "Andere"];
const LAENDER = ["Baden-Württemberg", "Bayern", "Berlin", "Brandenburg", "Bremen", "Hamburg", "Hessen", "Mecklenburg-Vorpommern", "Niedersachsen", "Nordrhein-Westfalen", "Rheinland-Pfalz", "Saarland", "Sachsen", "Sachsen-Anhalt", "Schleswig-Holstein", "Thüringen", "Österreich", "Schweiz"];
const KLASSEN = ["5", "6", "7", "8", "9", "10", "11", "12", "13"];
const BOX_TAGE = [0, 1, 3, 7, 16, 35];

let state = {
  ha: [], tests: [], faecher: [], plan: [],
  cfg: { seeded: false, streak: [], letzterCheck: "", erklaerstufe: "auto", theme: "system", einfachZaehler: 0 }
};
let profile = [];      // {id, name, klasse, schulform, land, h, pin}
let profil = null;     // aktives Profil
let ui = { tab: "heute", filter: "offen", calM: null, calSel: heute(), calAnsicht: "monat", scan: null, setup: null, pin: null };
let DB = null, SAMPLE = null, SAMPLE_LIMITS = null, DL = null;
let unsubs = [], dbBereit = false;
// Läuft die Seite auf dem eigenen Server, setzt die Vorlage dieses Kennzeichen.
// Dann kommen die Daten über die API statt aus dem Claude-Speicher.
const WEB = (typeof window !== "undefined" && window.SCHULPLANER_WEB === true);
let SRV = null;

const LS_PROF = "karo.v3.profile", LS_AKTIV = "karo.v3.aktiv";
const lsDaten = pid => "karo.v3.d." + pid;
function saveLocal() { if (profil) try { localStorage.setItem(lsDaten(profil.id), JSON.stringify(state)); } catch (e) { } }
function saveProfileLocal() { try { localStorage.setItem(LS_PROF, JSON.stringify(profile)); } catch (e) { } }
function ladeDaten(pid) {
  state = { ha: [], tests: [], faecher: [], plan: [], cfg: { seeded: false, streak: [], letzterCheck: "", erklaerstufe: "auto", theme: "system", einfachZaehler: 0 } };
  try {
    const raw = localStorage.getItem(lsDaten(pid));
    if (raw) { const o = JSON.parse(raw); for (const k in state) if (o[k] != null) state[k] = Object.assign(state[k], o[k]); }
  } catch (e) { }
}
function themaSetzen() {
  const t = (state.cfg && state.cfg.theme) || "system";
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
const hueVon = f => { const e = state.faecher.find(x => x.name === f); return e ? e.h : (FACH_HUE[f] != null ? FACH_HUE[f] : 214); };
function fachSichern(name) {
  if (!name || state.faecher.some(f => f.name === name)) return;
  state.faecher.push({ name: name, h: FACH_HUE[name] != null ? FACH_HUE[name] : Math.floor(Math.random() * 36) * 10 });
  putApp("faecher");
}

/* ===================== Speichern ===================== */
const P = () => "p/" + profil.id;
async function put(coll, obj) {
  const key = coll === "hausaufgaben" ? "ha" : "tests";
  const i = state[key].findIndex(x => x.id === obj.id);
  if (i >= 0) state[key][i] = obj; else state[key].unshift(obj);
  saveLocal(); render();
  if (SRV) { try { await api(srvPfad(coll) + obj.id, "PUT", obj); } catch (e) { srvFehler(e); } return; }
  if (DB) { try { await DB.doc(P() + "/" + coll + "/" + obj.id).set(obj); } catch (e) { dbFehler(e); } }
}
async function del(coll, id) {
  const key = coll === "hausaufgaben" ? "ha" : "tests";
  state[key] = state[key].filter(x => x.id !== id);
  saveLocal(); render();
  if (SRV) { try { await api(srvPfad(coll) + id, "DELETE"); } catch (e) { srvFehler(e); } return; }
  if (DB) { try { await DB.doc(P() + "/" + coll + "/" + id).delete(); } catch (e) { dbFehler(e); } }
}
async function putApp(feld) {
  saveLocal(); if (feld === "cfg") themaSetzen();
  if (SRV) {
    const inhalt = { faecher: state.faecher, plan: state.plan, cfg: state.cfg }[feld];
    try { await api("/api/" + feld, "PUT", inhalt); } catch (e) { srvFehler(e); }
    return;
  }
  if (!DB || !profil) return;
  const map = { faecher: { liste: state.faecher }, plan: { slots: state.plan }, cfg: state.cfg };
  try { await DB.doc(P() + "/app/" + feld).set(map[feld]); } catch (e) { dbFehler(e); }
}
async function putProfile() {
  if (SRV) {
    try { await api("/api/profil", "PUT", { klasse: profil.klasse, schulform: profil.schulform, land: profil.land, farbe: profil.h }); }
    catch (e) { srvFehler(e); }
    return;
  }
  saveProfileLocal();
  if (!DB) return;
  try { await DB.doc("app/profile").set({ liste: profile }); } catch (e) { dbFehler(e); }
}
function dbFehler(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") toast("Speicher voll. Räum alte Einträge auf.");
  else if (c === "resource_exhausted") toast("Zu viel auf einmal. Kurz warten.");
  else if (c === "revoked" || c === "not_granted") { DB = null; toast("Gespeichert wird jetzt nur auf diesem Gerät."); }
  else toast("Online speichern ging nicht. Lokal gesichert.");
}

async function initDB() {
  let db = null;
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { dbBereit = true; return; }
  DB = db;
  try {
    const d = await db.doc("app/profile").get();
    if (d.exists && Array.isArray(d.data().liste)) { profile = d.data().liste; saveProfileLocal(); }
  } catch (e) { }
  dbBereit = true;
  if (profil) abonniere();
  if (!ui.setup && !ui.pin) zeigeOberflaeche();
}
function abonniere() {
  unsubs.forEach(u => { try { u(); } catch (e) { } });
  unsubs = [];
  if (!DB || !profil) return;
  const b = P();
  unsubs.push(DB.collection(b + "/hausaufgaben").onSnapshot(s => {
    state.ha = s.docs.map(d => Object.assign({ id: d.id }, d.data())); saveLocal(); render();

async function api(pfad, methode, koerper) {
  const opt = { method: methode || "GET", credentials: "same-origin", headers: {} };
  if (koerper !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(koerper); }
  let r;
  try { r = await fetch(pfad, opt); }
  catch (e) { throw { code: "offline", message: "Keine Verbindung zum Server." }; }
  let daten = null;
  try { daten = await r.json(); } catch (e) { daten = null; }
  if (!r.ok) throw { code: r.status, message: (daten && daten.fehler) || "Der Server hat abgelehnt." };
  return daten || {};
}

/* ===================== Niveau ===================== */
function themaStand(t, titel) {
  const werte = [];
  const ks = (t.karten || []).filter(k => k.thema === titel && !k.neu);
  if (ks.length) werte.push(ks.reduce((a, k) => a + (Math.min(k.box || 1, 5) - 1) / 4, 0) / ks.length * 100);
  let r = 0, g = 0;
  for (const v of (t.versuche || []).slice(-3)) {
    const pt = (v.proThema || {})[titel];
    if (pt) { r += pt.r; g += pt.g; }
  }
  if (g) werte.push(r / g * 100);
  if (!werte.length) return null;
  return Math.round(werte.reduce((a, b) => a + b, 0) / werte.length);
}
function testStand(t) {
  const w = (t.themen || []).map(th => themaStand(t, th.titel)).filter(x => x != null);
  if (!w.length) return null;
  return Math.round(w.reduce((a, b) => a + b, 0) / w.length);
}
function standWort(s) { return s == null ? "noch offen" : s < 40 ? "wackelig" : s < 75 ? "kommt" : "sitzt"; }
function standKlasse(s) { return s == null ? "" : s < 40 ? "schwach" : s < 75 ? "mittel" : "gut"; }
function standHTML(s) {

}

const offeneHA = () => state.ha.filter(h => !h.erledigt);
const faelligHeute = () => offeneHA().filter(h => tageBis(h.faellig) <= 0);
const kommendeTests = () => state.tests.filter(t => tageBis(t.datum) >= 0).sort((a, b) => a.datum.localeCompare(b.datum));
const vergangeneTests = () => state.tests.filter(t => tageBis(t.datum) < 0).sort((a, b) => b.datum.localeCompare(a.datum));
function faelligeKarten() {
  const h = heute(); let n = 0;
  for (const t of state.tests) if (tageBis(t.datum) >= -1) for (const k of (t.karten || [])) if (!k.due || k.due <= h) n++;
  return n;

  return state.plan.filter(s => s.tag === tag).sort((a, b) => String(a.von).localeCompare(String(b.von)));

function streakTage() {
  const l = (state.cfg.streak || []).slice().sort();
  if (!l.length) return 0;
  let n = 0, d = heute();

async function bildVerkleinern(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, sk = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * sk); c.height = Math.round(img.height * sk);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return (await new Promise(r => c.toBlob(r, "image/jpeg", .86))) || file;
  } catch (e) { return file; } finally { URL.revokeObjectURL(url); }
}
async function bilderWaehlen(kamera, sofort) {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = (SAMPLE_LIMITS && SAMPLE_LIMITS.images && SAMPLE_LIMITS.images.mediaTypes.join(",")) || "image/*";
  if (kamera) inp.setAttribute("capture", "environment"); else inp.multiple = true;
  // Safari auf dem iPad öffnet die Auswahl nur, wenn das Feld wirklich im Dokument steht.
  inp.style.cssText = "position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0";
  document.body.appendChild(inp);
  const aufraeumen = () => { setTimeout(() => { if (inp.parentNode) inp.remove(); }, 600); };
  window.addEventListener("focus", aufraeumen, { once: true });
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    if (!files.length) { aufraeumen(); return; }
    const maxN = (SAMPLE_LIMITS && SAMPLE_LIMITS.images && SAMPLE_LIMITS.images.maxCount) || 1;
    const sc = (ui.scan && ui.scan.phase === "bilder") ? ui.scan : { phase: "bilder", blobs: [], urls: [] };
    for (const f of files) {
      if (sc.blobs.length >= maxN) break;
      const b = await bildVerkleinern(f);
      sc.blobs.push(b); sc.urls.push(URL.createObjectURL(b));
    }
    ui.scan = sc; ui.tab = "scan"; render();
    aufraeumen();
    if (sofort) scanLesen(sc.blobs, null);
  };
  inp.click();
}

        '<span class="notegross" style="margin-left:auto; color:var(--' + (notenGut(sch) === "grau" ? "ink-3" : notenGut(sch)) + ')">' + notenText(sch) + "</span></div>" +
        '<div class="row"><span class="lbl">Ziel</span><div class="notengrid" style="flex:1">' +
        werte.map(v => '<button data-act="zielwahl" data-id="' + esc(f) + "|" + v + '" aria-pressed="' + (z === v) + '" style="min-width:50px; min-height:40px; font-size:.9rem">' + notenText(v) + "</button>").join("") +
        (z != null ? '<button data-act="zielweg" data-id="' + esc(f) + '" style="min-width:44px; min-height:40px" aria-label="Ziel entfernen">✕</button>' : "") +
        "</div></div></div>";
    }).join("") : '<div class="empty">Erst Fächer anlegen.</div>'),
    '<button class="btn wide" data-act="sheetzu">Fertig</button>');
}

/* ===================== Nachfragen ===================== */
async function fragen(frage, einfacher) {
  if (!SAMPLE || !frage.trim()) return;
  let text = "";
  const zeig = () => sheet("Deine Frage",
    '<div class="card flat" style="padding:13px"><b style="font-weight:600; font-size:.95rem">' + esc(frage) + "</b></div>" +
    '<div class="aitext" id="erkl">' + (text ? esc(text) : '<span class="row"><span class="spin"></span><span class="dim">Antwort kommt gleich...</span></span>') + "</div>",
    '<button class="btn ghost" data-act="sheetzu">Schließen</button>' +
    (text && !einfacher ? '<button class="btn" data-act="fragwieder">' + svg("leicht") + "Einfacher</button>" : ""));
  window.__frage = frage;
  zeig();
  const p = "Ein Schüler stellt dir eine Frage zum Schulstoff. " + lernkontext() + "\n" +
    "Frage: " + frage + "\n\n" + erklaerAnweisung(null, einfacher) + "\n" +
    "Antworte in höchstens 200 Wörtern. Wenn es eine Rechnung ist, rechne Schritt für Schritt vor. Kein Markdown mit Sternchen, nur Text und Bindestriche. " +
    "Wenn die Frage nichts mit Schule zu tun hat, sag das freundlich in einem Satz.";
  try {
    const r = await SAMPLE(p, { modelTier: "default", onText: ({ text: t2 }) => { text = t2; const el = document.getElementById("erkl"); if (el) el.textContent = t2; } });
    text = r.text; zeig(); markiereLerntag();
  } catch (e) { sampleFehler(e, () => fragen(frage, einfacher)); }
}

/* ===================== Spickzettel ===================== */
async function spickzettel(t) {
  if (!SAMPLE) return;
  let text = "";
  window.__test = t;
  const zeig = () => sheet("Spickzettel",
    '<div class="row"><span class="chip" style="--h:' + hueVon(t.fach) + '">' + esc(t.fach) + '</span><span class="pill grau">' + esc(t.titel) + "</span></div>" +
    '<div class="aitext" id="erkl">' + (text ? esc(text) : '<span class="row"><span class="spin"></span><span class="dim">Wird zusammengefasst...</span></span>') + "</div>" +
    (text ? '<p class="kbdhint">Zum Lernen gedacht, nicht zum Mitnehmen in die Arbeit.</p>' : ""),
    '<button class="btn ghost" data-act="zurtest">Zurück</button>' +
    (text && DL ? '<button class="btn" data-act="spickspeichern">' + svg("download") + "Sichern</button>" : ""), { zurueck: "zurtest" });
  zeig();
  const themen = (t.themen || []).map(x => "- " + x.titel + (x.stichpunkte && x.stichpunkte.length ? ": " + x.stichpunkte.join("; ") : "")).join("\n");
  const p = "Schreibe eine Kurzfassung für die letzte Wiederholung vor einer Klassenarbeit. " + lernkontext() + "\n" +
    "Fach: " + t.fach + "\nArbeit: " + t.titel + "\nThemen:\n" + themen + "\n\n" +
    "Pro Thema eine Überschrift und darunter zwei bis vier Zeilen mit dem, was man wirklich können muss: Regeln, Formeln, Merksätze, Beispiele in Kurzform. " +
    "Alles auf eine Seite, höchstens 300 Wörter. Kein Markdown mit Sternchen, nur Text und Bindestriche.";
  try {
    const r = await SAMPLE(p, { modelTier: "complex", onText: ({ text: t2 }) => { text = t2; const el = document.getElementById("erkl"); if (el) el.textContent = t2; } });
    text = r.text; window.__spick = { t: t, text: text }; zeig();
  } catch (e) { sampleFehler(e, () => spickzettel(t)); }
}

  galerie: () => bilderWaehlen(false),
  textscan: () => { ui.scan = { phase: "text", text: "" }; render(); },
  scanweg: i => {
    const sc = ui.scan; if (!sc || !sc.blobs) return;
    URL.revokeObjectURL(sc.urls[Number(i)]);
    sc.blobs.splice(Number(i), 1); sc.urls.splice(Number(i), 1);
    if (!sc.blobs.length) ui.scan = { phase: "leer" };
    render();
  },
  scanreset: () => { if (ui.scan && ui.scan.urls) ui.scan.urls.forEach(u => URL.revokeObjectURL(u)); ui.scan = { phase: "leer" }; render(); },
  scanlesen: () => scanLesen(ui.scan.blobs, null),
  textlesen: () => { const v = ($("#scantext").value || "").trim(); if (!v) { toast("Schreib etwas hinein."); return; } scanLesen(null, v); },
  themaweg: i => { ui.scan.erg.themen.splice(Number(i), 1); render(); },
  scanhaweg: i => { ui.scan.erg.aufgaben.splice(Number(i), 1); if (!ui.scan.erg.aufgaben.length) ui.scan = { phase: "leer" }; render(); },
  scanhaspeichern: async () => {
    const auf = ui.scan.erg.aufgaben;
    ui.scan = { phase: "leer" };
    for (const a of auf) { fachSichern(a.fach); await put("hausaufgaben", { id: uid(), fach: a.fach, titel: a.titel, notiz: a.notiz, faellig: a.faellig, erledigt: false, erstellt: Date.now() }); }
    ui.tab = "aufgaben"; render(); toast(auf.length + " Aufgaben eingetragen.");
  },
  scanspeichern: async () => {
    const e = ui.scan.erg;
    const datum = $("#e-datum").value;
    if (!datum) { toast("Wann ist die Arbeit? Trag das Datum ein."); const el = $("#e-datum"); if (el) el.focus(); return; }
    const fach = ($("#e-fach").value || e.fach).trim();
    const t = { id: uid(), fach: fach, titel: ($("#e-titel").value || e.titel).trim(), datum: datum, themen: e.themen, karten: [], versuche: [], gewicht: 1, erstellt: Date.now() };
    fachSichern(fach);
    ui.scan = { phase: "leer" };
    await put("tests", t);
    ui.calSel = datum; ui.calM = datum.slice(0, 7);
    ui.tab = "lernen"; render();
    toast("Im Kalender am " + datumKurz(datum) + " eingetragen.");
    if (SAMPLE) kartenBauen(t); else sheetTest(t);
  },

  calansicht: id => { ui.calAnsicht = id; render(); },
  calmon: n => {
    const b = ui.calM ? fromISO(ui.calM + "-01") : fromISO(heute().slice(0, 7) + "-01");
    b.setMonth(b.getMonth() + Number(n));
    ui.calM = b.getFullYear() + "-" + pad(b.getMonth() + 1);
    render();
  },
  calwoche: n => { ui.calSel = plusTage(ui.calSel || heute(), Number(n)); render(); },
  calheute: () => { ui.calM = heute().slice(0, 7); ui.calSel = heute(); render(); },
  calday: iso => { ui.calSel = iso; if (iso.slice(0, 7) !== (ui.calM || heute().slice(0, 7))) ui.calM = iso.slice(0, 7); render(); },

  sfaecher: () => sheetFaecher(),
  splan: () => sheetPlan(),
  sbenachr: () => sheetBenachr(),
  benachrfrage: () => benachrAnfragen(),
  fachneu: () => {
    const v = ($("#neuesfach").value || "").trim(); if (!v) return;
    if (state.faecher.some(f => f.name === v)) { toast("Gibt es schon."); return; }
    state.faecher.push({ name: v, h: FACH_HUE[v] != null ? FACH_HUE[v] : Math.floor(Math.random() * 36) * 10 });
    putApp("faecher"); sheetFaecher();
  },
  fachweg: i => { state.faecher.splice(Number(i), 1); putApp("faecher"); sheetFaecher(); },
  slotneu: () => {
    state.plan.push({ id: uid(), tag: Number($("#p-tag").value), von: $("#p-von").value || "08:00", bis: $("#p-bis").value || "09:30", fach: $("#p-fach").value, raum: ($("#p-raum").value || "").trim() });
    putApp("plan"); sheetPlan();
  },
  slotweg: id => { state.plan = state.plan.filter(s => s.id !== id); putApp("plan"); sheetPlan(); },
  backup: () => backup(),
  beispielweg: async () => {
    const bh = state.ha.filter(x => x.beispiel), bt = state.tests.filter(x => x.beispiel);
    state.ha = state.ha.filter(x => !x.beispiel); state.tests = state.tests.filter(x => !x.beispiel);
    state.plan = state.plan.filter(x => !x.beispiel);
    saveLocal(); putApp("plan");
    if (DB) {
      for (const x of bh) try { await DB.doc(P() + "/hausaufgaben/" + x.id).delete(); } catch (e) { }
      for (const x of bt) try { await DB.doc(P() + "/tests/" + x.id).delete(); } catch (e) { }
    }
    render(); sheetSettings(); toast("Beispiele weg.");
  },
  alterweg: async () => {
    const grenze = plusTage(heute(), -21);
    const alt = state.ha.filter(x => x.erledigt && (x.erledigtAm || x.faellig) < grenze);
    if (!alt.length) { toast("Nichts zum Aufräumen."); return; }
    state.ha = state.ha.filter(x => alt.indexOf(x) < 0); saveLocal();
    if (DB) for (const x of alt) try { await DB.doc(P() + "/hausaufgaben/" + x.id).delete(); } catch (e) { }
    render(); sheetSettings(); toast(alt.length + " alte Einträge entfernt.");
  }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "INPUT") return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset.id, el, e); }
});
document.addEventListener("input", e => {
  const el = e.target.closest('[data-act="fachhue"]');
  if (!el) return;
  const f = state.faecher[Number(el.dataset.id)];
  if (f) { f.h = Number(el.value); const d = el.parentElement.querySelector(".dot"); if (d) d.style.setProperty("--h", f.h); }
});
document.addEventListener("change", e => { if (e.target.closest('[data-act="fachhue"]')) { saveLocal(); putApp("faecher"); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheet").hidden) return sheetZu();
  if (e.key === "Enter" && e.target.id === "quick") { e.preventDefault(); quickAdd(e.target.value || ""); }
  if (e.key === "Enter" && e.target.id === "frage") { e.preventDefault(); A.fragab(); }
  if (e.key === "Enter" && e.target.id === "neuesfach") { e.preventDefault(); A.fachneu(); }
  if (e.key === "Enter" && (e.target.id === "w-pw" || e.target.id === "w-pw2" || e.target.id === "w-name")) {
    e.preventDefault();
    if (e.target.id === "w-name") { const n = $("#w-pw"); if (n) n.focus(); return; }
    (ui.web && ui.web.modus === "konto" ? A.wkonto : A.wanmelden)();
  }
  if (!$("#sheet").hidden && flash) {
    if (e.key === " ") { e.preventDefault(); A.flashdreh(); }
    if (flash.auf && (e.key === "1" || e.key === "ArrowLeft")) A.flashnochmal();
    if (flash.auf && (e.key === "2" || e.key === "ArrowRight")) A.flashgut();
  }
});
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") sheetZu(); });

/* ===================== Start ===================== */
if (WEB) {
  zeigeOberflaeche();
  initWeb();
} else {
  try { const raw = localStorage.getItem(LS_PROF); if (raw) profile = JSON.parse(raw) || []; } catch (e) { }
  let aktiv = null;
  try { aktiv = localStorage.getItem(LS_AKTIV); } catch (e) { }
  const vor = profile.find(p => p.id === aktiv);
  if (vor) { profil = vor; ladeDaten(vor.id); }
  zeigeOberflaeche();
  initDB();
  initSample();
  initDownloads();
}
setTimeout(pruefeErinnerung, 4000);
setInterval(() => { if (document.visibilityState === "visible" && profil) { render(); pruefeErinnerung(); } }, 120000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && profil) render(); });
</script>

</body>
</html>
